# TubeForge — P0.6 smoke override (docs/production-readiness.md).
#
# NOT for production use — this file adds the pieces the production smoke
# needs on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.smoke.yml up -d --build
#
#   minio      — the object-storage node of the roadmap's target topology
#                (MinIO / S3-compatible); the web + worker roles flip to the
#                s3 driver against it, proving the real artifact path
#   minio-init — creates the bucket before the roles boot
#   web/worker — pinned to the DEDICATED-WORKER topology (TUBEFORGE_NO_CLAIM=1
#                on web) so the queue assertions below prove cross-process
#                execution in the worker container, not the web process

services:
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio-init:
    # The bucket creator. The old minio/mc image was REMOVED from Docker Hub
    # (the first smoke run died on the pull) — the aws-cli image against the
    # MinIO endpoint does the same job with zero auth ceremony.
    image: amazon/aws-cli:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://minio:9000 s3api create-bucket --bucket tubeforge 2>/dev/null || true &&
      echo '[minio-init] bucket ready'"

  web:
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      # The dedicated-worker topology: the web role enqueues only; the worker
      # executes. The smoke's queue assertions are cross-process by design.
      TUBEFORGE_NO_CLAIM: "1"
      TUBEFORGE_STORAGE_DRIVER: s3
      TUBEFORGE_S3_BUCKET: tubeforge
      TUBEFORGE_S3_ENDPOINT: http://minio:9000
      TUBEFORGE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      TUBEFORGE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}

  worker:
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      TUBEFORGE_STORAGE_DRIVER: s3
      TUBEFORGE_S3_BUCKET: tubeforge
      TUBEFORGE_S3_ENDPOINT: http://minio:9000
      TUBEFORGE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      TUBEFORGE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
