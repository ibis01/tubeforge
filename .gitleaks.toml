  # Stage 2 (2026-11-01) — e2e/isolation.spec.ts: the cross-tenant suite's
  # per-run fixture credentials (iso-a/-b@tubeforge.test, "isolated-pairs-123").
  "89ce85bb7be9cfbe82b2a8261f1e2e6c92f3a9a4",
  # S24 (2026-11-04) — s24-route-e2e.mjs + s24-unit-probe.mts: the billing
