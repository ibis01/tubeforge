<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" preserveAspectRatio="xMidYMid meet">
  <!-- Clock: outer circle + 12 ticks + hands. -->
  <g stroke="#111827" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path id="clock-outer" d="M 100 30 C 60 30 30 60 30 100 C 30 140 60 170 100 170 C 140 170 170 140 170 100 C 170 60 140 30 100 30 Z" />
    <path id="clock-tick12" d="M 100 40 L 100 55" />
    <path id="clock-tick3" d="M 160 100 L 145 100" />
    <path id="clock-tick6" d="M 100 160 L 100 145" />
    <path id="clock-tick9" d="M 40 100 L 55 100" />
    <path id="clock-hour" d="M 100 100 L 100 70" />
    <path id="clock-minute" d="M 100 100 L 130 100" />
  </g>
</svg>
