<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" preserveAspectRatio="xMidYMid meet">
  <!-- Drawing hand (right): pen tip at (0,0); body extends up-right.
       The composer places this with translate(tipX, tipY) rotate(angleDeg)
       so the tip lands exactly on the active draw point.

       Geometry: a stylized forearm + hand holding a marker. The marker's
       writing tip is at the SVG origin; the body lies along the +x axis
       so a rotation of 0° points the marker to the right (matching the
       default tangent direction atan2(0,1) = 0°). -->
  <g stroke="#111827" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- marker barrel: tip (0,0) → grip (40,-6) -->
    <path id="hand-marker" d="M 0 0 L 40 -6" stroke-width="10" />
    <!-- hand fingers wrapping the grip -->
    <path id="hand-fingers" d="M 38 -8 C 50 -2 60 6 70 18 C 80 30 86 44 90 60" />
    <!-- wrist + forearm trailing back -->
    <path id="hand-wrist" d="M 50 -2 C 65 8 80 28 92 56 L 100 76" />
  </g>
</svg>
