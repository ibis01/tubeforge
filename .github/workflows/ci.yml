# TubeForge CI (T-1.5, restored; e2e-on-main + gitleaks since S33)
#
# Contract:
#   secrets — gitleaks scans every push/PR for leaked credentials (roadmap §4.1)
#   check   — typecheck + lint + unit suite, on every push/PR
#   e2e     — Playwright suite, on PRs AND on pushes to main (S33: the repo
#             landed 240+ commits by direct push with zero PRs, so the PR-only
#             gate meant the 5 suites — including cross-tenant isolation —
#             never ran in CI; they now run on every push to main)
#
# NOTE: `npm run test:billing` is intentionally NOT part of CI yet — it needs
# a seeded SQLite database (see scripts/test-billing.mts header). Wiring it
# in (deterministic seed inside the job) is tracked in the S33+ backlog (P1).
# The unit suite renders its QC fixtures with ffmpeg, so the runner needs it.
#
# Pushing this file requires a PAT with `workflow` scope (GitHub rejects
# workflow files otherwise). See worklog T-1.5 / T-5.2 / S33.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — gitleaks scans all commits
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Free for personal (user-owned) repositories; if this repo ever
          # moves to an org, GITLEAKS_LICENSE becomes required.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Typecheck · Lint · Unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install ffmpeg (QC fixtures + render pipeline)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies (postinstall bootstraps SQLite + Prisma)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit + regression suite
        run: npm run test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: check
    # S33: run on PRs AND on pushes to main (was PR-only — never fired,
    # because this repository has no pull-request history).
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install ffmpeg (render pipeline)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E suite (boots its own dev server on :3000)
        run: npm run test:e2e
        env:
          CI: true
